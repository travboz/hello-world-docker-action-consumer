# This is a basic workflow to help you get started with Actions

name: Consumer
description: "This workflow consumes the 'hello-world-docker-action' docker action created alongside the docs."

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  use-docker-action:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: "Hello world action step"
        id: hello
        uses: travboz/hello-world-docker-action@v1.0.6
        with:
          who-to-greet: "Bob The Builder"

      - name: "Get the output time from the action"
        run: |
          echo "The time was ${{ steps.hello.outputs.time }}"
        
